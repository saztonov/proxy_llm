# /etc/nginx/sites-available/proxy_llm.conf
# ⚠️ ЭТО ФИНАЛЬНЫЙ vhost. Применять ПОСЛЕ выпуска сертификата
#    (см. deploy/INSTALL.md, шаги 6-7).

limit_req_zone  $binary_remote_addr zone=proxy_llm_api:10m  rate=60r/m;
limit_conn_zone $binary_remote_addr zone=proxy_llm_conn:10m;
# Агентский контур: мягкие лимиты на IP — десятки сотрудников через Cursor приходят с нескольких
# общих egress-IP Cursor. Настоящие лимиты — на владельца токена, в приложении.
limit_req_zone  $binary_remote_addr zone=proxy_llm_agent:10m      rate=1200r/m;
limit_conn_zone $binary_remote_addr zone=proxy_llm_agent_conn:10m;
limit_req_zone  $binary_remote_addr zone=proxy_llm_admin:10m      rate=120r/m;

server {
    listen 443 ssl http2;
    server_name proxy.example.com;       # подставить реальный домен

    ssl_certificate     /etc/letsencrypt/live/proxy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.example.com/privkey.pem;

    client_max_body_size 26m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Публичный liveness — для UptimeRobot
    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }

    # API — только с IP PassDesk
    location /api/ {
        allow 1.2.3.4;                   # IP PassDesk VPS — подставить
        deny all;

        # Таймауты: > REQUEST_DEADLINE_MS=420s, чтобы 504 шёл от прокси, а не от nginx
        proxy_read_timeout   480s;
        proxy_send_timeout   480s;
        proxy_request_buffering off;     # не буферизуем 16 МБ входящий body в nginx
        proxy_buffering off;             # стримим ответ от прокси клиенту

        limit_req  zone=proxy_llm_api  burst=20 nodelay;
        limit_conn proxy_llm_conn 3;     # защита Node от одновременного чтения многих 16МБ body

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # Dashboard — только админ/VPN. Маленькие JSON/HTML, буферизация по умолчанию.
    location /dashboard {
        allow 5.6.7.8;                   # IP админа — подставить
        # allow 9.10.11.12;              # IP VPN — раскомментировать если есть
        deny all;

        proxy_read_timeout   30s;
        proxy_send_timeout   30s;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Агентский контур (/agent/v1: Cursor, Continue, OpenAI SDK). БЕЗ IP-allowlist: Cursor ходит
    # со своих облачных серверов. Защита — токен pl_agent_ и лимиты на владельца в приложении.
    # fail2ban по IP здесь не вешать: бан общего egress-IP Cursor отключил бы всех сотрудников.
    location /agent/ {
        client_max_body_size 1m;         # = AGENT_BODY_LIMIT_BYTES
        proxy_read_timeout   660s;       # > AGENT_REQUEST_DEADLINE_MS=600s
        proxy_send_timeout   660s;
        proxy_http_version   1.1;
        proxy_set_header     Connection "";
        proxy_request_buffering off;     # тело не копится в nginx: ранний 413/401 отдаёт приложение
        proxy_buffering      off;        # SSE: чанки уходят клиенту сразу
        proxy_cache          off;
        chunked_transfer_encoding on;

        limit_req  zone=proxy_llm_agent burst=300 nodelay;
        limit_conn proxy_llm_agent_conn 200;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Админ-сайт — только с IP админа/VPN, как /dashboard.
    location /admin {
        allow 5.6.7.8;                   # IP админа — подставить
        deny all;

        client_max_body_size 1m;
        proxy_read_timeout   30s;
        proxy_send_timeout   30s;
        limit_req zone=proxy_llm_admin burst=60 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Обязательно: по нему считается лимит попыток входа (без него все админы — 127.0.0.1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # По нему интерфейс строит адрес /agent/v1 для инструкции сотрудникам.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное — закрыто
    location / {
        deny all;
        return 404;
    }
}

# HTTP → редирект на HTTPS (опционально, certbot добавит автоматически)
server {
    listen 80;
    server_name proxy.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
